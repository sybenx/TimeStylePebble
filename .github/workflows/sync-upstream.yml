# Merges new commits from the original TimeStyle (freakified/TimeStylePebble)
# into this fork's master once a day. If the merge conflicts, nothing is
# pushed and the run fails, which makes GitHub email the repo owner. The merge
# logic (including the version-number handling) is in
# .github/scripts/merge-upstream.sh. After a successful merge, release.yml is
# called to build and publish the new version.
name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.merge.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/freakified/TimeStylePebble.git
          .github/scripts/merge-upstream.sh

  # pushes made with GITHUB_TOKEN don't trigger other workflows, so build and
  # release by calling the workflow directly, but only if a merge was pushed
  release:
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: master
    secrets: inherit
    permissions:
      contents: write

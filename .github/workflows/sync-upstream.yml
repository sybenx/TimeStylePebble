# Merges new commits from the original TimeStyle (freakified/TimeStylePebble)
# into this fork's master once a day. If the merge conflicts, nothing is
# pushed and the run fails, which makes GitHub email the repo owner.
name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/freakified/TimeStylePebble.git
          git fetch upstream master

          new=$(git rev-list --count HEAD..upstream/master)
          echo "Upstream commits to merge: $new"
          if [ "$new" -eq 0 ]; then
            exit 0
          fi

          if git merge --no-edit upstream/master; then
            git push origin master
          else
            git merge --abort
            echo "::error::Merging upstream conflicts. Locally run: git fetch https://github.com/freakified/TimeStylePebble.git master && git merge FETCH_HEAD, resolve, and push."
            exit 1
          fi
